<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 140" role="img" aria-label="Geetanjali Jewellers">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DDBB6A"/>
      <stop offset="50%" stop-color="#C9A24D"/>
      <stop offset="100%" stop-color="#A8842E"/>
    </linearGradient>
  </defs>

  <!-- Circular jewellery motif -->
  <g transform="translate(70,70)">
    <circle r="52" fill="none" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <circle r="42" fill="none" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.85"/>
    <circle r="8" fill="url(#goldGrad)"/>
    <!-- Petal accents -->
    <g fill="none" stroke="url(#goldGrad)" stroke-width="1.5">
      <ellipse cx="0" cy="-26" rx="10" ry="16"/>
      <ellipse cx="0" cy="26" rx="10" ry="16"/>
      <ellipse cx="26" cy="0" rx="16" ry="10"/>
      <ellipse cx="-26" cy="0" rx="16" ry="10"/>
      <ellipse cx="18" cy="-18" rx="8" ry="14" transform="rotate(45 18 -18)"/>
      <ellipse cx="-18" cy="18" rx="8" ry="14" transform="rotate(45 -18 18)"/>
      <ellipse cx="18" cy="18" rx="8" ry="14" transform="rotate(-45 18 18)"/>
      <ellipse cx="-18" cy="-18" rx="8" ry="14" transform="rotate(-45 -18 -18)"/>
    </g>
    <circle r="3" cx="0" cy="-42" fill="url(#goldGrad)"/>
    <circle r="3" cx="0" cy="42" fill="url(#goldGrad)"/>
    <circle r="3" cx="42" cy="0" fill="url(#goldGrad)"/>
    <circle r="3" cx="-42" cy="0" fill="url(#goldGrad)"/>
  </g>

  <!-- Wordmark -->
  <text x="150" y="62" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="600" letter-spacing="4" fill="#064E3B">GEETANJALI</text>
  <text x="150" y="92" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="400" letter-spacing="8" fill="#C9A24D">JEWELLERS</text>
  <line x1="150" y1="102" x2="480" y2="102" stroke="#C9A24D" stroke-width="1" opacity="0.6"/>
  <text x="150" y="122" font-family="Arial, Helvetica, sans-serif" font-size="10" letter-spacing="2.5" fill="#6B6B6B">KUNDAN · GOLD · DIAMOND</text>
</svg>
